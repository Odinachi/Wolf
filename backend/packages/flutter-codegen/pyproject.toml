[project]
name = "wolf-flutter-codegen"
version = "0.1.0"
description = "Compiles a Wolf app schema into a Flutter project."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolf_flutter"]
