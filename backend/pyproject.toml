[project]
name = "wolf-backend"
version = "0.1.0"
description = "Wolf backend: auth, projects, the AI agent, builds and sharing."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "wolf-flutter-codegen",
    "firebase-admin>=6.5",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.workspace]
members = ["packages/flutter-codegen"]

[tool.uv.sources]
wolf-flutter-codegen = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wolf_api"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/flutter-codegen/tests"]
pythonpath = ["packages/flutter-codegen/tests"]
asyncio_mode = "auto"
